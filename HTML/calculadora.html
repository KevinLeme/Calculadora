<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Neon</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1b1b2f, #0f0f1a);
    font-family: Arial, sans-serif;
}

.calculadora {
    width: 320px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px rgba(0,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.1);
}

#visor {
    width: 100%;
    height: 70px;
    border: none;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 30px;
    text-align: right;
    padding: 10px;
    color: #00f7ff;
    background: rgba(0,0,0,0.4);
    outline: none;
}

.botoes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.95);
}

.numero {
    background: rgba(255,255,255,0.08);
    color: white;
}

.numero:hover {
    background: rgba(255,255,255,0.15);
}

.operador {
    background: linear-gradient(135deg, #00f7ff, #0077ff);
    color: white;
    font-weight: bold;
}

.operador:hover {
    box-shadow: 0 0 10px #00f7ff;
}

.igual {
    background: linear-gradient(135deg, #00ff88, #00c853);
    color: white;
    font-weight: bold;
}

.limpar {
    background: linear-gradient(135deg, #ff3c3c, #ff0055);
    color: white;
}
</style>
</head>

<body>

<div class="calculadora">
    <input id="visor" readonly>

    <div class="botoes">
        <button class="limpar" onclick="limpar()">C</button>
        <button class="operador" onclick="adicionar('(')">(</button>
        <button class="operador" onclick="adicionar(')')">)</button>
        <button class="operador" onclick="adicionar('/')">÷</button>

        <button class="numero" onclick="adicionar('7')">7</button>
        <button class="numero" onclick="adicionar('8')">8</button>
        <button class="numero" onclick="adicionar('9')">9</button>
        <button class="operador" onclick="adicionar('*')">×</button>

        <button class="numero" onclick="adicionar('4')">4</button>
        <button class="numero" onclick="adicionar('5')">5</button>
        <button class="numero" onclick="adicionar('6')">6</button>
        <button class="operador" onclick="adicionar('-')">−</button>

        <button class="numero" onclick="adicionar('1')">1</button>
        <button class="numero" onclick="adicionar('2')">2</button>
        <button class="numero" onclick="adicionar('3')">3</button>
        <button class="operador" onclick="adicionar('+')">+</button>

        <button class="numero" onclick="adicionar('0')">0</button>
        <button class="numero" onclick="adicionar('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
        <button class="operador" onclick="potencia()">xʸ</button>
    </div>
</div>

<script>
const visor = document.getElementById("visor");

function adicionar(v) {
    visor.value += v;
}

function limpar() {
    visor.value = "";
}

function calcular() {
    try {
        visor.value = eval(visor.value);
    } catch {
        visor.value = "Erro";
    }
}

function potencia() {
    const base = prompt("Base:");
    const exp = prompt("Expoente:");
    if (base && exp) {
        visor.value = Math.pow(base, exp);
    }
}
</script>

</body>
</html>
